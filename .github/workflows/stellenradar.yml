name: Stellenradar

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python stellenradar.py
      - name: Ergebnis speichern
        run: |
          git config user.name "stellenradar-bot"
          git config user.email "stellenradar-bot@users.noreply.github.com"
          git add docs/index.html data/stellen.json
          git commit -m "Stellen aktualisiert" || echo "Keine Änderungen"
          git push
